<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House of J&S Computer - Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #D4AF37;
            --secondary-gold: #F9E076;
            --dark-gold: #B8860B;
            --bg-color: #FCFCFC;
            --text-color: #2C3E50;
            --light-gray: #F5F5F5;
            --correct-green: #28a745;
            --wrong-red: #dc3545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(135deg, #ffffff 0%, #fffbf0 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid var(--primary-gold);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
            margin-bottom: 40px;
        }

        .logo {
            max-width: 180px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.1));
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            color: var(--dark-gold);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            font-weight: 300;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .question-card {
            background: #fff;
            border: 1px solid #E8E8E8;
            border-left: 5px solid var(--primary-gold);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .question-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.1);
        }

        .question-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .question-number {
            background: var(--primary-gold);
            color: #fff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-left: 38px;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .options label:hover {
            background: var(--light-gray);
        }

        .options input[type="radio"], 
        .options input[type="checkbox"] {
            accent-color: var(--primary-gold);
            width: 18px;
            height: 18px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px 15px;
            margin-top: 10px;
            margin-left: 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            transition: border 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        .fill-blank-input {
            display: inline-block;
            width: auto;
            min-width: 200px;
            margin-top: 0;
            padding: 8px 12px;
        }

        .submit-container {
            text-align: center;
            margin-top: 40px;
        }

        button {
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--dark-gold) 100%);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Results Section */
        #results-section {
            display: none;
            margin-top: 50px;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .score-board {
            background: #fff;
            border: 2px solid var(--primary-gold);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }

        .score-board h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--dark-gold);
        }

        .score-text {
            font-size: 1.2rem;
            color: #555;
        }

        .result-item {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #ccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .result-item.correct {
            border-left-color: var(--correct-green);
            background: #f0fff4;
        }

        .result-item.wrong {
            border-left-color: var(--wrong-red);
            background: #fff5f5;
        }

        .result-question {
            font-weight: 600;
            margin-bottom: 10px;
        }

        .result-answer {
            font-size: 0.95rem;
            margin-bottom: 5px;
        }

        .user-answer {
            color: var(--wrong-red);
            text-decoration: line-through;
        }

        .correct-answer {
            color: var(--correct-green);
            font-weight: 600;
        }

        .explanation {
            font-size: 0.9rem;
            color: #666;
            font-style: italic;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #ddd;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            .question-card { padding: 15px; }
            .options { margin-left: 0; }
            button { width: 100%; }
        }
    </style>
</head>

        // LOGIC: Render, Check, and Display Results
        // ==========================================

        const quizContainer = document.getElementById('quiz-container');
        const quizForm = document.getElementById('quiz-form');
        const resultsSection = document.getElementById('results-section');
        const scoreDisplay = document.getElementById('score-display');
        const scorePercentage = document.getElementById('score-percentage');
        const detailedResults = document.getElementById('detailed-results');

        // 1. Render Questions to the UI
        function renderQuiz() {
            quizData.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `question-${q.id}`;

                let questionHTML = `
                    <div class="question-title">
                        <span class="question-number">${index + 1}</span>
                        <span>${q.question}</span>
                    </div>
                `;

                if (q.type === 'mcq') {
                    questionHTML += `<div class="options">`;
                    q.options.forEach(opt => {
                        questionHTML += `
                            <label>
                                <input type="radio" name="q${q.id}" value="${opt}">
                                ${opt}
                            </label>
                        `;
                    });
                    questionHTML += `</div>`;
                } else if (q.type === 'text') {
                    questionHTML += `
                        <div class="options">
                            <input type="text" name="q${q.id}" placeholder="Type your answer here..." autocomplete="off">
                        </div>
                    `;
                }

                card.innerHTML = questionHTML;
                quizContainer.appendChild(card);
            });
        }

        // 2. Handle Form Submission and Auto-Check
        quizForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            let score = 0;
            let total = quizData.length;
            let resultHTML = '';

            quizData.forEach((q, index) => {
                let userAnswer = '';
                
                if (q.type === 'mcq') {
                    const selectedOption = document.querySelector(`input[name="q${q.id}"]:checked`);
                    if (selectedOption) {
                        userAnswer = selectedOption.value;
                    }
                } else if (q.type === 'text') {
                    const textInput = document.querySelector(`input[name="q${q.id}"]`);
                    if (textInput) {
                        userAnswer = textInput.value.trim();
                    }
                }

                // Check Answer (Case-insensitive for text inputs)
                let isCorrect = false;
                let correctAnswerDisplay = q.correctAnswer;

                if (q.type === 'mcq') {
                    isCorrect = (userAnswer === q.correctAnswer);
                } else if (q.type === 'text') {
                    // Flexible checking for text answers (lowercase, remove extra spaces)
                    const cleanUser = userAnswer.toLowerCase().replace(/[.,!?]/g, '');
                    const cleanCorrect = q.correctAnswer.toLowerCase().replace(/[.,!?]/g, '');
                    // Check if user answer contains the key phrase or is exact
                    isCorrect = cleanUser.includes(cleanCorrect) || cleanCorrect.includes(cleanUser);
                }

                if (isCorrect) {
                    score++;
                }

                // Build Result Display
                const resultClass = isCorrect ? 'correct' : 'wrong';
                const icon = isCorrect ? '✅' : '❌';
                
                let userAnswerDisplay = userAnswer || '<em>(No answer provided)</em>';
                if (!isCorrect && q.type === 'text' && userAnswer) {
                    userAnswerDisplay = `<span class="user-answer">${userAnswer}</span>`;
                }

                resultHTML += `
                    <div class="result-item ${resultClass}">
                        <div class="result-question">${icon} Q${index + 1}: ${q.question}</div>
                        <div class="result-answer">Your answer: ${userAnswerDisplay}</div>
                        ${!isCorrect ? `<div class="result-answer correct-answer">Correct answer: ${correctAnswerDisplay}</div>` : ''}
                        <div class="explanation">💡 ${q.explanation}</div>
                    </div>
                `;
            });

            // Calculate Percentage
            const percentage = Math.round((score / total) * 100);

            // Update UI
            scoreDisplay.textContent = `${score} / ${total}`;
            scorePercentage.textContent = `Score: ${percentage}%`;
            detailedResults.innerHTML = resultHTML;

            // Hide Quiz, Show Results
            quizForm.style.display = 'none';
            resultsSection.style.display = 'block';

            // Scroll to top of results
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        });

        // Initialize the quiz on page load
        window.onload = renderQuiz;

    </script>
